<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="AuditOS — an AI-native operating system for assurance engagements">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="300" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="298" rx="19" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <!-- subtle hierarchy motif on the right: nodes converging to one state, echoing the Shared Audit State -->
  <g opacity="0.35" stroke="#93c5fd" stroke-width="2" fill="none">
    <circle cx="1080" cy="90" r="6" fill="#93c5fd" stroke="none"/>
    <circle cx="1080" cy="150" r="6" fill="#93c5fd" stroke="none"/>
    <circle cx="1080" cy="210" r="6" fill="#93c5fd" stroke="none"/>
    <circle cx="1180" cy="150" r="10" fill="#bfdbfe" stroke="none"/>
    <path d="M1086 90 L1170 145"/>
    <path d="M1086 150 L1170 150"/>
    <path d="M1086 210 L1170 155"/>
  </g>

  <!-- icon mark, matching the in-app header brand mark -->
  <rect x="60" y="92" width="116" height="116" rx="26" fill="#ffffff"/>
  <text x="118" y="180" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#2563eb" text-anchor="middle">A</text>

  <text x="210" y="165" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">AuditOS</text>
  <text x="212" y="205" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#bfdbfe">An AI-native operating system for assurance engagements</text>
</svg>
